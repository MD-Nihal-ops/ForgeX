services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: forgex
      POSTGRES_USER: forgex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - forgex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgex -d forgex"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      FORGEX_USE_DATABASE: "true"
      DATABASE_URL: postgresql+asyncpg://forgex:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/forgex
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; r=urlopen('http://127.0.0.1:8000/api/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      FORGEX_API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./exports:/app/exports:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; r=urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  forgex-postgres-data:
